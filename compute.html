<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cluster–cluster aggregation — compute</title>
  <link rel="stylesheet" href="styles.css" />
  <script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.dataset.embed = '';</script>
</head>
<body>
  <main class="app compute">
    <header class="masthead">
      <div>
        <p class="eyebrow">Monte Carlo</p>
        <h1>Cluster–cluster aggregation — compute</h1>
      </div>
      <nav class="masthead-links"><a href="index.html">← Interactive</a></nav>
    </header>

    <section class="panel">
      <form id="form" class="form">
        <label class="control"><span class="control-label">Density <em>p</em></span><input name="density" type="number" min="0" max="1" step="0.01" value="0.3" /></label>
        <label class="control"><span class="control-label">Box side <em>L</em></span><input name="L" type="number" min="3" max="400" value="32" /></label>
        <label class="control"><span class="control-label">Exponent <em>α</em></span><input name="alpha" type="number" step="0.1" value="1" /></label>
        <fieldset class="control choice">
          <legend class="control-label">Sampling</legend>
          <label><input type="radio" name="sampling" value="directional" checked /> Directional</label>
          <label><input type="radio" name="sampling" value="isotropic" /> Isotropic</label>
        </fieldset>
        <label class="control"><span class="control-label">Shots</span><input name="shots" type="number" min="1" value="200" /></label>
        <label class="control"><span class="control-label">Seed</span><input name="seed" type="text" value="1" /></label>
        <label class="control"><span class="control-label">Time samples</span><input name="samples" type="number" min="2" max="2000" value="40" /></label>
        <fieldset class="control choice">
          <legend class="control-label">Grid spacing</legend>
          <label><input type="radio" name="spacing" value="linear" checked /> Linear</label>
          <label><input type="radio" name="spacing" value="log" /> Logarithmic</label>
        </fieldset>
        <label class="control"><span class="control-label">Point A (x, y)</span><span class="inline"><input name="ax" type="number" value="0" /><input name="ay" type="number" value="0" /></span></label>
        <label class="control"><span class="control-label">Point B (x, y)</span><span class="inline"><input name="bx" type="number" value="4" /><input name="by" type="number" value="0" /></span></label>
        <div class="wide">
          <button id="run" type="submit" class="primary">Run</button>
          <button id="cancel" type="button" class="secondary" disabled>Cancel</button>
          <progress id="progress" value="0" max="1"></progress>
          <span id="progress-text" class="status">idle</span>
        </div>
      </form>
    </section>

    <section id="results" class="panel results" hidden>
      <p id="summary" class="summary"></p>

      <div class="toolbar">
        <label>Series
          <select id="series">
            <option value="size">E[cluster size at A]</option>
            <option value="pConnected">P(A and B connected)</option>
            <option value="pOccupied">P(A occupied)</option>
          </select>
        </label>
        <label><input id="fit" type="checkbox" checked /> linear fit</label>
      </div>
      <div id="fit-text" class="stats"></div>
      <canvas id="chart" class="plot"></canvas>

      <h2 class="chart-heading">Graph distance A–B</h2>
      <div id="distance-text" class="stats"></div>
      <canvas id="histogram" class="plot"></canvas>

      <h2 class="chart-heading">Mean graph distance (0, 0) → (n, 0)</h2>
      <div class="toolbar">
        <label><input id="scan-fit" type="checkbox" checked /> linear fit</label>
      </div>
      <div id="scan-text" class="stats"></div>
      <canvas id="scan-chart" class="plot"></canvas>

      <div class="toolbar"><button id="csv" type="button" class="secondary">Download CSV</button></div>
    </section>
  </main>
  <script type="module" src="src/compute.js"></script>
  <script type="module" src="src/embed.js"></script>
</body>
</html>
